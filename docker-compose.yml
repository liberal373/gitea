# networks:
#   gitea:
#     external: false

# volumes:
#   gitea:
#     driver: local

services:
  server:
    image: docker.gitea.com/gitea:28.2.0
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=Asia/Shanghai
    restart: always
    # networks:
    #   - gitea
    volumes:
      # - gitea:/data
      - ./data:/data
    ports:
      - "3000:3000"
  runner:
    image: docker.io/gitea/runner:5-dind
    restart: always
    depends_on:
      - server
    privileged: true
    environment:
      GITEA_INSTANCE_URL: ${GITEA_INSTANCE_URL}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN}
    volumes:
      - ./data-runner:/data
      - runner-docker:/var/lib/docker

volumes:
  runner-docker: